<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Map UI</title>
    <style>
        body {
            background: url('assets/images/104439109_10157371513388581_3048654716169080871_n.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 2em;
            margin-bottom: 30px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #444;
        }

        select, button {
            padding: 12px;
            margin: 15px 0;
            width: 100%;
            max-width: 300px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        img {
            width: 100%;
            max-width: 300px;
            margin-bottom: 25px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Campus Map</h1>
        <img src="assets/images/Untitled_design-Photoroom.png" alt="Campus Map">
        <label for="destination">Select Destination:</label>
        <select id="destination">
            <option value="A">Faculty of Engineering</option>
            <option value="B">Faculty of Science</option>
            <option value="C">Central Library</option>
            <option value="D">Canteen</option>
        </select>
        <button onclick="goToMap()">GO</button>
    </div>

    <audio id="startSound" src="assets/audio/newhello.mp3"></audio>

    <script>
        function goToMap() {
            const sound = document.getElementById('startSound');
            sound.play();
            const destination = document.getElementById('destination').value;
            setTimeout(() => {
                window.location.href = `map.html?destination=${encodeURIComponent(destination)}`;
            }, 1000); // หน่วงเวลานิดนึงให้เสียงเล่น
        }
    </script>
</body>
</html>
